<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="./main.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>Lista de Tarefas</h1>
            <p class="subtitle">Adicione tarefas e clique nelas para marcar como concluídas.</p>

            <form id="form-tarefa" class="form">
                <input type="text" id="nome-tarefa" placeholder="Digite uma tarefa" required>
                <button type="submit">Cadastrar</button>
            </form>

            <ul id="lista-tarefas" class="lista"></ul>
        </section>
    </main>

    <script src="./main.js"></script>
</body>
</html>
