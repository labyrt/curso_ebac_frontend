<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validação de Formulário</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Validação de números</h1>

    <form id="form-numeros">
      <label for="campo-a">Campo A</label>
      <input type="number" id="campo-a" name="campo-a" required />

      <label for="campo-b">Campo B</label>
      <input type="number" id="campo-b" name="campo-b" required />

      <button type="submit">Enviar</button>
    </form>

    <p id="mensagem" class="mensagem" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
