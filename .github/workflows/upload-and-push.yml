name: Upload zip and create branch

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Public URL para o arquivo .zip (ex.: https://site.com/exercicio_less.zip)'
        required: true
      branch_name:
        description: 'Nome da branch a ser criada (ex.: add-exercicio-less)'
        required: true

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Preparar ferramentas
        run: sudo apt-get update && sudo apt-get install -y unzip curl

      - name: Baixar zip
        run: |
          curl -L "${{ github.event.inputs.zip_url }}" -o /tmp/art.zip

      - name: Extrair e copiar conteúdo
        run: |
          mkdir -p tmp_exercise
          unzip -o /tmp/art.zip -d tmp_exercise
          # copia todo conteúdo (incl. arquivos ocultos) da raiz do zip para o workspace
          cp -a tmp_exercise/. .

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Criar e trocar para a nova branch
        run: |
          git checkout -b "${{ github.event.inputs.branch_name }}"

      - name: Commitar alterações (se houver)
        run: |
          git add -A
          git commit -m "Adiciona exercicio_less (upload via Actions)" || echo "Sem alterações para commitar"

      - name: Push da branch
        run: |
          git push -u origin "${{ github.event.inputs.branch_name }}"
