name: Validate eFood Parte 3

on:
  push:
    branches:
      - efood_parte_3_redux_carrinho
  pull_request:
    branches:
      - efood_parte_3_redux_carrinho

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
