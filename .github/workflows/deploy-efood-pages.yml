name: Deploy eFood Parte 4 to GitHub Pages

on:
  push:
    branches:
      - efood_parte_4_checkout
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Parte 4
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Parte 4 dependencies
        run: npm ci

      - name: Build Parte 4
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          GITHUB_PAGES_BASE: '/curso_ebac_frontend/efood-parte-4/'

      - name: Checkout Parte 3
        uses: actions/checkout@v6
        with:
          ref: efood_parte_3_redux_carrinho
          path: efood-parte-3

      - name: Install Parte 3 dependencies
        working-directory: efood-parte-3
        run: npm ci

      - name: Build Parte 3
        working-directory: efood-parte-3
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          GITHUB_PAGES_BASE: '/curso_ebac_frontend/efood-parte-3/'

      - name: Checkout entrega inicial
        uses: actions/checkout@v6
        with:
          ref: react_router_efood
          path: previous-efood

      - name: Install entrega inicial dependencies
        working-directory: previous-efood
        run: npm install --no-audit --no-fund

      - name: Build entrega inicial
        working-directory: previous-efood
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Assemble Pages preserving previous deliveries
        run: |
          mkdir -p pages-artifact/efood-parte-3
          mkdir -p pages-artifact/efood-parte-4
          cp -a previous-efood/dist/. pages-artifact/
          cp -a efood-parte-3/dist/. pages-artifact/efood-parte-3/
          cp -a dist/. pages-artifact/efood-parte-4/
          touch pages-artifact/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
