<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício boas práticas de CSS</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <main class="products">
        <article class="products__item">
            <img
                class="products__image"
                src="https://via.placeholder.com/100x100"
                alt="Imagem ilustrativa do produto"
            >
            <h2 class="products__name">Nome do produto</h2>
            <p class="products__description">Descrição do produto</p>
        </article>

        <article class="products__item products__item--featured">
            <img
                class="products__image"
                src="https://via.placeholder.com/100x100"
                alt="Imagem ilustrativa do produto em destaque"
            >
            <h2 class="products__name">Nome do produto</h2>
            <p class="products__description">Descrição do produto</p>
        </article>

        <article class="products__item">
            <img
                class="products__image"
                src="https://via.placeholder.com/100x100"
                alt="Imagem ilustrativa do produto"
            >
            <h2 class="products__name">Nome do produto</h2>
            <p class="products__description">Descrição do produto</p>
        </article>
    </main>
</body>
</html>
